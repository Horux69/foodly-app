services:
  db:
    image: postgres:16-alpine
    container_name: resto_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resto}
      POSTGRES_DB: ${POSTGRES_DB:-resto_platform}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resto}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: resto_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
