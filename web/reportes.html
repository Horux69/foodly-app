<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reportes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Roles de color de los graficos. Una sola serie por grafico: todo lo
         que se mide aqui es una magnitud (dinero o conteo), no identidades,
         asi que va un solo tono y ninguna leyenda. */
      .viz {
        --series-1: #2a78d6;
        --gridline: #e2e8f0;
        --text-muted: #64748b;
      }
      .bar-col {
        background: var(--series-1);
        border-radius: 4px 4px 0 0; /* extremo redondeado, recto en la base */
      }
      .bar-row {
        background: var(--series-1);
        border-radius: 0 4px 4px 0;
      }
    </style>
  </head>
  <body class="bg-slate-100 min-h-screen">
    <div id="nav"></div>

    <main class="max-w-7xl mx-auto p-4 space-y-4 viz">
      <!-- Filtros: una sola fila sobre los graficos -->
      <div class="bg-white rounded-xl border border-slate-200 p-3 flex flex-wrap items-end gap-3">
        <div class="flex gap-1" id="presets"></div>
        <div class="flex items-end gap-2">
          <label class="block">
            <span class="block text-xs text-slate-600 mb-1">Desde</span>
            <input id="from" type="date" class="rounded-lg border border-slate-300 px-2 py-1.5 text-sm" />
          </label>
          <label class="block">
            <span class="block text-xs text-slate-600 mb-1">Hasta</span>
            <input id="to" type="date" class="rounded-lg border border-slate-300 px-2 py-1.5 text-sm" />
          </label>
        </div>
        <label class="block" id="branch-wrap">
          <span class="block text-xs text-slate-600 mb-1">Sucursal</span>
          <select id="branch" class="rounded-lg border border-slate-300 px-2 py-1.5 text-sm">
            <option value="">Todas</option>
          </select>
        </label>
        <button id="apply" class="bg-slate-900 text-white rounded-lg px-4 py-1.5 text-sm font-medium">Aplicar</button>
      </div>

      <div id="content" class="space-y-4"></div>
    </main>

    <div id="tip" class="hidden fixed z-50 px-2 py-1 rounded bg-slate-900 text-white text-xs pointer-events-none"></div>
    <div id="toast" class="hidden"></div>

    <script src="/app.js"></script>
    <script>
      let me = null;

      const PRESETS = [
        { key: '7', label: '7 dias', days: 6 },
        { key: '30', label: '30 dias', days: 29 },
        { key: '90', label: '90 dias', days: 89 },
      ];

      function isoDate(d) {
        return d.toISOString().slice(0, 10);
      }

      function applyPreset(days) {
        const to = new Date();
        const from = new Date();
        from.setDate(to.getDate() - days);
        document.getElementById('from').value = isoDate(from);
        document.getElementById('to').value = isoDate(to);
      }

      // ---------- piezas de grafico ----------

      function statTile(label, value, hint) {
        return `
          <div class="bg-white rounded-xl border border-slate-200 p-4">
            <div class="text-sm text-slate-600">${label}</div>
            <div class="text-2xl font-semibold text-slate-900 mt-1">${value}</div>
            ${hint ? `<div class="text-xs text-slate-500 mt-1">${hint}</div>` : ''}
          </div>`;
      }

      // Columnas: alto proporcional al valor. El eje lleva el maximo redondeado
      // y las columnas no se etiquetan una por una (solo el tooltip), que es
      // lo que evita el ruido cuando hay muchas barras.
      function columnChart(title, rows, { labelOf, valueOf, format }) {
        if (!rows.length) return emptyCard(title);
        const max = Math.max(...rows.map(valueOf));
        const bars = rows
          .map((row) => {
            const value = valueOf(row);
            const height = max > 0 ? Math.max((value / max) * 100, 2) : 2;
            return `
              <div class="flex-1 flex flex-col items-center gap-1 min-w-0"
                   data-tip="${labelOf(row)}: ${format(value)}">
                <div class="w-full flex-1 flex items-end px-[1px]">
                  <div class="bar-col w-full max-w-[24px] mx-auto" style="height:${height}%"></div>
                </div>
                <div class="text-[10px] text-slate-500 truncate w-full text-center">${labelOf(row)}</div>
              </div>`;
          })
          .join('');
        return `
          <div class="bg-white rounded-xl border border-slate-200 p-4">
            <h3 class="font-semibold text-slate-900 mb-1">${title}</h3>
            <div class="text-xs text-slate-500 mb-3 tabular-nums">Maximo ${format(max)}</div>
            <div class="h-40 flex items-stretch gap-1 border-b" style="border-color: var(--gridline)">${bars}</div>
          </div>`;
      }

      // Barras horizontales para rankings: pocas filas, valor directo en la
      // punta (no hay riesgo de saturar y ahorra un eje).
      function barList(title, rows, { labelOf, valueOf, format, subOf }) {
        if (!rows.length) return emptyCard(title);
        const max = Math.max(...rows.map(valueOf));
        const items = rows
          .map((row) => {
            const value = valueOf(row);
            const width = max > 0 ? Math.max((value / max) * 100, 1) : 1;
            return `
              <div class="space-y-1" data-tip="${labelOf(row)}: ${format(value)}">
                <div class="flex justify-between gap-2 text-sm">
                  <span class="text-slate-900 truncate">${labelOf(row)}</span>
                  <span class="text-slate-600 tabular-nums whitespace-nowrap">
                    ${format(value)}${subOf ? ` <span class="text-slate-400">${subOf(row)}</span>` : ''}
                  </span>
                </div>
                <div class="h-2"><div class="bar-row h-full" style="width:${width}%"></div></div>
              </div>`;
          })
          .join('');
        return `
          <div class="bg-white rounded-xl border border-slate-200 p-4">
            <h3 class="font-semibold text-slate-900 mb-3">${title}</h3>
            <div class="space-y-3">${items}</div>
          </div>`;
      }

      function emptyCard(title) {
        return `
          <div class="bg-white rounded-xl border border-slate-200 p-4">
            <h3 class="font-semibold text-slate-900 mb-2">${title}</h3>
            <p class="text-sm text-slate-500">Sin datos en este periodo.</p>
          </div>`;
      }

      // ---------- carga ----------

      async function load() {
        const content = document.getElementById('content');
        content.innerHTML = '<p class="text-sm text-slate-500">Cargando...</p>';

        const params = new URLSearchParams();
        const from = document.getElementById('from').value;
        const to = document.getElementById('to').value;
        const branch = document.getElementById('branch').value;
        if (from) params.set('from_date', from);
        if (to) params.set('to_date', to);
        if (branch) params.set('branch_id', branch);
        const qs = params.toString() ? `?${params}` : '';

        let sales, products, prep, hours;
        try {
          [sales, products, prep, hours] = await Promise.all([
            api(`/reports/sales${qs}`),
            api(`/reports/top-products${qs}`),
            api(`/reports/prep-times${qs}`),
            api(`/reports/peak-hours${qs}`),
          ]);
        } catch (err) {
          content.innerHTML = '';
          toast(err.message);
          return;
        }

        const t = sales.totals;
        const minutes = (v) => (v === null ? 'sin datos' : `${Number(v).toFixed(0)} min`);

        content.innerHTML = `
          <!-- Un solo numero protagonista por vista -->
          <div class="bg-white rounded-xl border border-slate-200 p-6">
            <div class="text-sm text-slate-600">Ingresos del periodo</div>
            <div class="text-5xl font-semibold text-slate-900 mt-1">${money(t.revenue)}</div>
            <div class="text-sm text-slate-500 mt-2">
              ${sales.from_date} a ${sales.to_date} · solo pedidos completados
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            ${statTile('Pedidos vendidos', t.orders)}
            ${statTile('Ticket promedio', money(t.avg_ticket))}
            ${statTile('Cocina, tiempo mediano', minutes(prep.median_minutes),
              prep.orders ? `promedio ${minutes(prep.avg_minutes)} · pico ${minutes(prep.max_minutes)}` : 'sin pedidos medidos')}
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            ${columnChart('Ingresos por dia', sales.by_day, {
              labelOf: (r) => r.day.slice(5),
              valueOf: (r) => Number(r.revenue),
              format: money,
            })}
            ${columnChart('Pedidos por hora', hours, {
              labelOf: (r) => `${r.hour}h`,
              valueOf: (r) => r.orders,
              format: (v) => `${v} pedidos`,
            })}
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            ${barList('Productos mas vendidos', products, {
              labelOf: (r) => r.name,
              valueOf: (r) => r.units,
              format: (v) => `${v} u`,
              subOf: (r) => money(r.revenue),
            })}
            ${barList('Ingresos por canal', sales.by_channel, {
              labelOf: (r) => r.channel,
              valueOf: (r) => Number(r.revenue),
              format: money,
              subOf: (r) => `${r.orders} pedidos`,
            })}
          </div>

          ${
            sales.by_branch.length > 1
              ? barList('Ingresos por sucursal', sales.by_branch, {
                  labelOf: (r) => r.branch_name,
                  valueOf: (r) => Number(r.revenue),
                  format: money,
                  subOf: (r) => `${r.orders} pedidos`,
                })
              : ''
          }

          <details class="bg-white rounded-xl border border-slate-200 p-4">
            <summary class="cursor-pointer font-semibold text-slate-900">Ver los datos en tabla</summary>
            <table class="w-full text-sm mt-3">
              <thead class="text-left text-slate-500 border-b border-slate-200">
                <tr><th class="py-1">Dia</th><th class="py-1 text-right">Pedidos</th><th class="py-1 text-right">Ingresos</th></tr>
              </thead>
              <tbody class="tabular-nums">
                ${sales.by_day
                  .map(
                    (r) =>
                      `<tr class="border-b border-slate-100"><td class="py-1">${r.day}</td>
                       <td class="py-1 text-right">${r.orders}</td>
                       <td class="py-1 text-right">${money(r.revenue)}</td></tr>`
                  )
                  .join('')}
              </tbody>
            </table>
          </details>`;

        wireTooltips();
      }

      // ---------- tooltip ----------

      function wireTooltips() {
        const tip = document.getElementById('tip');
        document.querySelectorAll('[data-tip]').forEach((el) => {
          el.addEventListener('mouseenter', () => {
            tip.textContent = el.dataset.tip;
            tip.classList.remove('hidden');
          });
          el.addEventListener('mousemove', (e) => {
            tip.style.left = `${e.clientX + 12}px`;
            tip.style.top = `${e.clientY - 28}px`;
          });
          el.addEventListener('mouseleave', () => tip.classList.add('hidden'));
        });
      }

      // ---------- arranque ----------

      async function init() {
        me = await requireSession();
        setCurrency(me.currency);
        document.getElementById('nav').innerHTML = renderNav(me, '/reportes.html');

        document.getElementById('presets').innerHTML = PRESETS.map(
          (p) =>
            `<button data-days="${p.days}" class="preset border border-slate-300 rounded-lg px-3 py-1.5 text-sm hover:border-slate-900">${p.label}</button>`
        ).join('');
        document.querySelectorAll('.preset').forEach((b) =>
          b.addEventListener('click', () => {
            applyPreset(Number(b.dataset.days));
            load();
          })
        );

        // El filtro de sucursal solo aparece si el usuario puede listarlas.
        if (can(me, 'settings.view')) {
          try {
            const branches = await api('/branches');
            document.getElementById('branch').innerHTML =
              '<option value="">Todas</option>' +
              branches.map((b) => `<option value="${b.id}">${b.name}</option>`).join('');
          } catch {
            document.getElementById('branch-wrap').classList.add('hidden');
          }
        } else {
          document.getElementById('branch-wrap').classList.add('hidden');
        }

        document.getElementById('apply').addEventListener('click', load);
        applyPreset(29);
        await load();
      }

      init().catch((err) => toast(err.message));
    </script>
  </body>
</html>
