<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seguimiento de tu pedido</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#101322" />
    <link rel="icon" href="/iconos/app.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />

    <!--
      La página del cliente, no la del restaurante.

      Va aparte de la aplicación y no comparte sus módulos a propósito:
      quien la abre no tiene sesión —la aplicación lo mandaría a la pantalla
      de ingreso—, la abre desde un enlace de WhatsApp, casi siempre con
      datos móviles y una sola vez. Un archivo que se explica solo pesa
      menos que la aplicación entera y no se rompe cuando la aplicación
      cambia.

      Sin Tailwind por CDN por lo mismo: son unas pocas reglas y el cliente
      no tiene por qué esperar a un tercero para ver dónde va su comida.

      El DOM se arma con `h()` y `textContent`, igual que en la aplicación:
      el nombre de un producto viene de la base y aquí tampoco se interpola
      en HTML.
    -->
    <style>
      /* Misma paleta que la aplicación (web/app.css), en claro solamente:
         esta página no tiene interruptor de tema — se abre una vez, desde
         un enlace de WhatsApp, y no vale la pena la infraestructura de
         `tema.js` para una sola visita. */
      :root {
        --tinta: #101322;
        --suave: #585E7A;
        --linea: #DCE0EE;
        --acento: #4F46E5;
        --aviso: #B7791F;
        --aviso-suave: #FDF6E7;
        --peligro: #DC2626;
        --peligro-suave: #FDEEEE;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #ECEEF6;
        color: var(--tinta);
        font: 15px/1.5 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 460px; margin: 0 auto; padding: 24px 16px 48px; }
      .tarjeta {
        background: #fff;
        border: 1px solid var(--linea);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 16px;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .suave { color: var(--suave); font-size: 13px; }
      .numero { font-variant-numeric: tabular-nums; font-weight: 600; }
      .pasos { list-style: none; margin: 0; padding: 0; }
      .paso { display: flex; align-items: center; gap: 10px; padding: 7px 0; color: var(--suave); }
      .paso .punto {
        width: 12px; height: 12px; border-radius: 999px;
        border: 2px solid var(--linea); background: #fff; flex: none;
      }
      .paso.hecho { color: var(--tinta); }
      .paso.hecho .punto { background: var(--acento); border-color: var(--acento); }
      .paso.actual { color: var(--tinta); font-weight: 600; }
      .linea { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-size: 14px; }
      .total { border-top: 1px solid var(--linea); margin-top: 10px; padding-top: 10px; font-weight: 600; }
      .aviso { background: var(--aviso-suave); border: 1px solid var(--aviso); color: var(--aviso); border-radius: 12px; padding: 12px; font-size: 14px; }
      .malo { background: var(--peligro-suave); border-color: var(--peligro); color: var(--peligro); }
    </style>
  </head>
  <body>
    <main id="vista">
      <p class="suave">Cargando tu pedido…</p>
    </main>

    <script type="module">
      const REFRESCO_MS = 30000;

      /** El mismo helper de la aplicación, en pequeño: nada de innerHTML. */
      function h(tag, props = {}, ...hijos) {
        const el = document.createElement(tag);
        for (const [k, v] of Object.entries(props)) {
          if (v === null || v === undefined || v === false) continue;
          if (k === 'class') el.className = v;
          else el.setAttribute(k, v);
        }
        for (const hijo of hijos.flat()) {
          if (hijo === null || hijo === undefined || hijo === false) continue;
          el.append(hijo instanceof Node ? hijo : document.createTextNode(String(hijo)));
        }
        return el;
      }

      const vista = document.getElementById('vista');
      const render = (...hijos) => {
        vista.replaceChildren();
        for (const hijo of hijos.flat()) if (hijo) vista.append(hijo);
      };

      const dinero = (valor, moneda) =>
        new Intl.NumberFormat('es-CO', {
          style: 'currency',
          currency: moneda || 'COP',
          maximumFractionDigits: 0,
        }).format(Number(valor));

      const hora = (iso) =>
        iso
          ? new Date(iso.replace(' ', 'T')).toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' })
          : null;

      const token = new URLSearchParams(location.search).get('t') ?? '';

      async function cargar() {
        if (!token) return render(h('div', { class: 'aviso malo' }, 'Este enlace está incompleto.'));

        let datos;
        try {
          const respuesta = await fetch(`/api/v1/public/orders/${encodeURIComponent(token)}`);
          if (!respuesta.ok) {
            return render(
              h('div', { class: 'aviso malo' }, 'No encontramos ese pedido. Revisa el enlace con el restaurante.')
            );
          }
          datos = await respuesta.json();
        } catch {
          return render(h('div', { class: 'aviso' }, 'Sin conexión. Vuelve a intentarlo en un momento.'));
        }

        pintar(datos);
      }

      function pintar(d) {
        const cabecera = h(
          'div',
          { class: 'tarjeta' },
          h('h1', {}, d.restaurant.name ?? 'Tu pedido'),
          h('p', { class: 'suave' }, [d.restaurant.branch, `Pedido ${d.order_number}`].filter(Boolean).join(' · ')),
          d.restaurant.phone ? h('p', { class: 'suave' }, `Tel. ${d.restaurant.phone}`) : null
        );

        const estado = d.cancelled
          ? h(
              'div',
              { class: 'tarjeta' },
              h('div', { class: 'aviso malo' }, 'Este pedido fue anulado. Si no sabías, llama al restaurante.')
            )
          : h(
              'div',
              { class: 'tarjeta' },
              h('p', { class: 'suave' }, 'Estado'),
              h('h1', {}, d.status),
              h(
                'ul',
                { class: 'pasos' },
                d.steps.map((nombre, i) =>
                  h(
                    'li',
                    {
                      class: `paso ${i < d.step ? 'hecho' : ''} ${i === d.step ? 'hecho actual' : ''}`.trim(),
                    },
                    h('span', { class: 'punto' }),
                    nombre
                  )
                )
              ),
              d.promised_at ? h('p', { class: 'suave' }, `Prometido para las ${hora(d.promised_at)}`) : null,
              d.courier_name ? h('p', { class: 'suave' }, `${d.courier_name} lo lleva`) : null,
              d.delivered_at ? h('p', { class: 'suave' }, `Entregado a las ${hora(d.delivered_at)}`) : null
            );

        const detalle = h(
          'div',
          { class: 'tarjeta' },
          d.address ? h('p', { class: 'suave' }, d.address) : null,
          d.items.map((i) => h('div', { class: 'linea' }, h('span', {}, `${i.quantity}× ${i.name}`))),
          h(
            'div',
            { class: 'linea total' },
            h('span', {}, 'Total'),
            h('span', { class: 'numero' }, dinero(d.total, d.currency))
          )
        );

        render(cabecera, estado, detalle, h('p', { class: 'suave' }, 'Esta página se actualiza sola.'));
      }

      cargar();
      // Se refresca sola: quien espera comida deja la pantalla abierta y no
      // debería tener que recargar para ver si ya salió.
      setInterval(cargar, REFRESCO_MS);
    </script>
  </body>
</html>
