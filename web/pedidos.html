<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen">
    <div id="nav"></div>

    <main class="max-w-7xl mx-auto p-4">
      <div class="flex gap-2 mb-4">
        <button data-tab="nuevo" class="tab px-4 py-2 rounded-lg text-sm font-medium">Nuevo pedido</button>
        <button data-tab="dia" class="tab px-4 py-2 rounded-lg text-sm font-medium">Pedidos del dia</button>
      </div>

      <!-- NUEVO PEDIDO -->
      <section id="panel-nuevo" class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div class="lg:col-span-2 space-y-4" id="menu"></div>

        <aside class="bg-white rounded-xl border border-slate-200 p-4 space-y-4 h-fit lg:sticky lg:top-4">
          <h2 class="font-semibold text-slate-900">Pedido</h2>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Canal</label>
              <select id="channel" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm"></select>
            </div>
            <div id="table-wrap" class="hidden">
              <label class="block text-xs font-medium text-slate-600 mb-1">Mesa</label>
              <input id="table-code" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm" />
            </div>
          </div>

          <details class="text-sm">
            <summary class="cursor-pointer text-slate-600">Cliente y ajustes</summary>
            <div class="mt-2 space-y-2">
              <input id="customer-phone" placeholder="Telefono" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm" />
              <input id="customer-name" placeholder="Nombre" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm" />
              <div class="grid grid-cols-2 gap-2">
                <label class="block">
                  <span class="text-xs text-slate-600">Domicilio</span>
                  <input id="delivery-fee" type="number" min="0" value="0" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm" />
                </label>
                <label class="block">
                  <span class="text-xs text-slate-600">Descuento</span>
                  <input id="discount" type="number" min="0" value="0" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm" />
                </label>
                <label class="block" id="tip-wrap">
                  <span class="text-xs text-slate-600">Propina</span>
                  <input id="tip" type="number" min="0" value="0" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm" />
                </label>
              </div>
              <textarea id="notes" placeholder="Notas" rows="2" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm"></textarea>
            </div>
          </details>

          <div id="cart" class="divide-y divide-slate-100 border-y border-slate-100"></div>

          <div id="totals" class="text-sm space-y-1"></div>

          <button id="submit" class="w-full bg-slate-900 text-white rounded-lg py-2.5 font-medium hover:bg-slate-800 disabled:opacity-40">
            Crear pedido
          </button>
        </aside>
      </section>

      <!-- PEDIDOS DEL DIA -->
      <section id="panel-dia" class="hidden space-y-3"></section>
    </main>

    <!-- Modal de modificadores -->
    <div id="modal" class="hidden fixed inset-0 z-40 bg-black/40 flex items-center justify-center p-4">
      <div class="bg-white rounded-xl max-w-md w-full max-h-[85vh] overflow-y-auto">
        <div class="p-4 border-b border-slate-200">
          <h3 id="modal-title" class="font-semibold text-slate-900"></h3>
        </div>
        <div id="modal-body" class="p-4 space-y-4"></div>
        <div class="p-4 border-t border-slate-200 flex gap-2">
          <button onclick="closeModal()" class="flex-1 border border-slate-300 rounded-lg py-2 text-sm font-medium">Cancelar</button>
          <button id="modal-add" class="flex-1 bg-slate-900 text-white rounded-lg py-2 text-sm font-medium">Agregar</button>
        </div>
      </div>
    </div>

    <div id="toast" class="hidden"></div>

    <script src="/app.js"></script>
    <script>
      let me = null;
      let menu = [];
      let cart = [];

      // ---------- arranque ----------

      async function init() {
        me = await requireSession();
        setCurrency(me.currency);
        document.getElementById('nav').innerHTML = renderNav(me, '/pedidos.html');

        const channelEl = document.getElementById('channel');
        channelEl.innerHTML = me.channels.map((c) => `<option value="${c}">${c}</option>`).join('');

        // La configuracion del restaurante decide que se muestra: no tiene
        // sentido pedir mesa donde no hay mesas ni propina donde no se cobra.
        if (me.uses_tables) document.getElementById('table-wrap').classList.remove('hidden');
        if (!me.asks_tip) document.getElementById('tip-wrap').classList.add('hidden');

        menu = await api('/menu');
        renderMenu();
        renderCart();
        switchTab('nuevo');
      }

      // ---------- menu ----------

      function renderMenu() {
        const el = document.getElementById('menu');
        if (!menu.length) {
          el.innerHTML = `<div class="bg-white rounded-xl border border-slate-200 p-8 text-center text-slate-500">
            Este restaurante todavia no tiene productos en el menu.</div>`;
          return;
        }

        el.innerHTML = menu
          .map(
            (cat) => `
          <div class="bg-white rounded-xl border border-slate-200 p-4">
            <h2 class="font-semibold text-slate-900 mb-3">${cat.name}</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
              ${cat.items
                .map(
                  (item) => `
                <button
                  onclick="pick('${item.id}')"
                  ${item.is_available ? '' : 'disabled'}
                  class="text-left border border-slate-200 rounded-lg p-3 hover:border-slate-900 disabled:opacity-40 disabled:hover:border-slate-200">
                  <div class="font-medium text-sm text-slate-900">${item.name}</div>
                  <div class="text-sm text-slate-500 mt-1">${money(item.price)}</div>
                  ${item.is_available ? '' : '<div class="text-xs text-red-600 mt-1">Agotado</div>'}
                </button>`
                )
                .join('')}
            </div>
          </div>`
          )
          .join('');
      }

      function findItem(id) {
        for (const cat of menu) {
          const found = cat.items.find((i) => i.id === id);
          if (found) return found;
        }
        return null;
      }

      // ---------- modificadores ----------

      let pendingItem = null;

      function pick(itemId) {
        const item = findItem(itemId);
        if (!item.modifier_groups.length) {
          addToCart(item, []);
          return;
        }
        pendingItem = item;
        openModal(item);
      }

      function openModal(item) {
        document.getElementById('modal-title').textContent = item.name;
        document.getElementById('modal-body').innerHTML = item.modifier_groups
          .map((group) => {
            // Un grupo de seleccion unica se comporta como radio; uno de
            // varias, como checkbox. El backend valida igual en ambos casos.
            const single = group.max_select === 1;
            const hint = group.is_required
              ? 'obligatorio'
              : `hasta ${group.max_select}`;
            return `
            <div>
              <div class="flex items-baseline justify-between mb-2">
                <span class="font-medium text-sm text-slate-900">${group.name}</span>
                <span class="text-xs text-slate-500">${hint}</span>
              </div>
              <div class="space-y-1">
                ${group.modifiers
                  .map(
                    (m) => `
                  <label class="flex items-center gap-2 text-sm ${m.is_available ? '' : 'opacity-40'}">
                    <input type="${single ? 'radio' : 'checkbox'}" name="g-${group.id}"
                      value="${m.id}" data-group="${group.id}" ${m.is_available ? '' : 'disabled'} />
                    <span class="flex-1">${m.name}</span>
                    ${Number(m.price_delta) ? `<span class="text-slate-500">+${money(m.price_delta)}</span>` : ''}
                  </label>`
                  )
                  .join('')}
              </div>
            </div>`;
          })
          .join('');
        document.getElementById('modal').classList.remove('hidden');
      }

      function closeModal() {
        document.getElementById('modal').classList.add('hidden');
        pendingItem = null;
      }

      document.getElementById('modal-add').addEventListener('click', () => {
        const checked = [...document.querySelectorAll('#modal-body input:checked')];
        const modifiers = checked.map((input) => {
          const group = pendingItem.modifier_groups.find((g) => g.id === input.dataset.group);
          return group.modifiers.find((m) => m.id === input.value);
        });
        addToCart(pendingItem, modifiers);
        closeModal();
      });

      // ---------- carrito ----------

      function addToCart(item, modifiers) {
        // La clave agrupa lineas identicas: mismo producto con la misma
        // seleccion de modificadores suma cantidad en vez de duplicarse.
        const key = `${item.id}|${modifiers.map((m) => m.id).sort().join(',')}`;
        const existing = cart.find((l) => l.key === key);
        if (existing) {
          existing.quantity += 1;
        } else {
          cart.push({ key, item, modifiers, quantity: 1 });
        }
        renderCart();
      }

      function changeQty(key, delta) {
        const line = cart.find((l) => l.key === key);
        if (!line) return;
        line.quantity += delta;
        if (line.quantity <= 0) cart = cart.filter((l) => l.key !== key);
        renderCart();
      }

      function renderCart() {
        const el = document.getElementById('cart');
        document.getElementById('submit').disabled = cart.length === 0;

        if (!cart.length) {
          el.innerHTML = '<p class="py-6 text-center text-sm text-slate-400">Sin productos</p>';
          document.getElementById('totals').innerHTML = '';
          return;
        }

        el.innerHTML = cart
          .map(
            (line) => `
          <div class="py-2 flex items-start gap-2">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-slate-900">${line.item.name}</div>
              ${
                line.modifiers.length
                  ? `<div class="text-xs text-slate-500">${line.modifiers.map((m) => m.name).join(', ')}</div>`
                  : ''
              }
            </div>
            <div class="flex items-center gap-1">
              <button onclick="changeQty('${line.key}', -1)" class="w-6 h-6 rounded border border-slate-300 text-slate-600">-</button>
              <span class="w-6 text-center text-sm">${line.quantity}</span>
              <button onclick="changeQty('${line.key}', 1)" class="w-6 h-6 rounded border border-slate-300 text-slate-600">+</button>
            </div>
          </div>`
          )
          .join('');

        refreshTotals();
      }

      // ---------- totales ----------

      function buildPayload() {
        return {
          channel: document.getElementById('channel').value,
          table_code: me.uses_tables ? document.getElementById('table-code').value || null : null,
          customer_phone: document.getElementById('customer-phone').value || null,
          customer_name: document.getElementById('customer-name').value || null,
          notes: document.getElementById('notes').value || null,
          delivery_fee: Number(document.getElementById('delivery-fee').value || 0),
          discount: Number(document.getElementById('discount').value || 0),
          tip: me.asks_tip ? Number(document.getElementById('tip').value || 0) : 0,
          items: cart.map((line) => ({
            menu_item_id: line.item.id,
            quantity: line.quantity,
            modifier_ids: line.modifiers.map((m) => m.id),
          })),
        };
      }

      // Los totales los calcula el backend. El frontend nunca repite esa
      // aritmetica (principio 5): pide el preview y muestra lo que llega.
      let previewTimer = null;
      function refreshTotals() {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(async () => {
          if (!cart.length) return;
          const el = document.getElementById('totals');
          try {
            const t = await api('/orders/preview', {
              method: 'POST',
              body: JSON.stringify(buildPayload()),
            });
            const row = (label, value, strong) =>
              `<div class="flex justify-between ${strong ? 'font-semibold text-slate-900 text-base pt-1 border-t border-slate-200' : 'text-slate-600'}">
                 <span>${label}</span><span>${money(value)}</span></div>`;
            el.innerHTML =
              row('Subtotal', t.subtotal) +
              (Number(t.tax_total) ? row('Impuesto incluido', t.tax_total) : '') +
              (Number(t.delivery_fee) ? row('Domicilio', t.delivery_fee) : '') +
              (Number(t.discount) ? row('Descuento', `-${t.discount}`) : '') +
              (Number(t.tip) ? row('Propina', t.tip) : '') +
              row('Total', t.total, true);
          } catch (err) {
            el.innerHTML = `<p class="text-sm text-red-600">${err.message}</p>`;
          }
        }, 250);
      }

      ['delivery-fee', 'discount', 'tip', 'channel'].forEach((id) => {
        document.getElementById(id).addEventListener('change', refreshTotals);
      });

      // ---------- crear ----------

      document.getElementById('submit').addEventListener('click', async () => {
        const button = document.getElementById('submit');
        button.disabled = true;
        try {
          const order = await api('/orders', {
            method: 'POST',
            body: JSON.stringify(buildPayload()),
          });
          toast(`Pedido ${order.order_number} creado por ${money(order.total)}`, 'ok');
          cart = [];
          document.getElementById('notes').value = '';
          document.getElementById('customer-phone').value = '';
          document.getElementById('customer-name').value = '';
          renderCart();
        } catch (err) {
          toast(err.message);
        } finally {
          button.disabled = cart.length === 0;
        }
      });

      // ---------- pedidos del dia ----------

      async function loadOrders() {
        const panel = document.getElementById('panel-dia');
        panel.innerHTML = '<p class="text-slate-500 text-sm">Cargando...</p>';

        const orders = await api('/orders');
        if (!orders.length) {
          panel.innerHTML = '<p class="text-slate-500 text-sm">Todavia no hay pedidos.</p>';
          return;
        }

        // El saldo se consulta por pedido: es el backend quien sabe cuanto
        // falta, no una resta hecha aqui.
        const balances = await Promise.all(
          orders.map((o) => api(`/orders/${o.id}/balance`).catch(() => null))
        );

        panel.innerHTML = orders
          .map((order, index) => {
            const balance = balances[index];
            const pending = balance && !balance.is_settled;
            return `
            <div class="bg-white rounded-xl border border-slate-200 p-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <span class="font-semibold text-slate-900">${order.order_number}</span>
                  <span class="text-sm text-slate-500 ml-2">${order.channel}</span>
                </div>
                <div class="text-right">
                  <div class="font-semibold text-slate-900">${money(order.total)}</div>
                  ${
                    balance
                      ? pending
                        ? `<div class="text-xs text-amber-600">Falta ${money(balance.pending)}</div>`
                        : '<div class="text-xs text-emerald-600">Pagado</div>'
                      : ''
                  }
                </div>
              </div>
              <div class="text-sm text-slate-600 mt-2">
                ${order.items.map((i) => `${i.quantity}x ${i.name_snapshot}`).join(', ')}
              </div>
              ${
                pending && can(me, 'payments.register')
                  ? `<div class="mt-3 flex flex-wrap gap-2">
                       ${['cash', 'card', 'transfer']
                         .map(
                           (method) =>
                             `<button onclick="pay('${order.id}', '${method}', ${balance.pending})"
                                class="text-sm border border-slate-300 rounded-lg px-3 py-1.5 hover:border-slate-900">
                                Cobrar ${money(balance.pending)} en ${method}</button>`
                         )
                         .join('')}
                     </div>`
                  : ''
              }
            </div>`;
          })
          .join('');
      }

      async function pay(orderId, method, amount) {
        try {
          await api(`/orders/${orderId}/payments`, {
            method: 'POST',
            body: JSON.stringify({ method, amount }),
          });
          toast('Pago registrado', 'ok');
          loadOrders();
        } catch (err) {
          toast(err.message);
        }
      }

      // ---------- pestanas ----------

      function switchTab(name) {
        document.querySelectorAll('.tab').forEach((button) => {
          const active = button.dataset.tab === name;
          button.className = `tab px-4 py-2 rounded-lg text-sm font-medium ${
            active ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-200'
          }`;
        });
        document.getElementById('panel-nuevo').classList.toggle('hidden', name !== 'nuevo');
        document.getElementById('panel-dia').classList.toggle('hidden', name !== 'dia');
        if (name === 'dia') loadOrders();
      }

      document.querySelectorAll('.tab').forEach((button) => {
        button.addEventListener('click', () => switchTab(button.dataset.tab));
      });

      init().catch((err) => toast(err.message));
    </script>
  </body>
</html>
