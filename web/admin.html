<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Administracion</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen">
    <div id="nav"></div>

    <main class="max-w-5xl mx-auto p-4">
      <div class="flex flex-wrap gap-2 mb-4" id="tabs"></div>
      <div id="panel" class="space-y-4"></div>
    </main>

    <div id="toast" class="hidden"></div>

    <script src="/app.js"></script>
    <script>
      let me = null;
      let state = { settings: null, branches: [], taxes: [], roles: [], users: [], permissions: [] };

      const CHANNELS = ['counter', 'table', 'delivery', 'whatsapp', 'app'];

      const TABS = [
        { key: 'config', label: 'Configuracion', permission: 'settings.view' },
        { key: 'sucursales', label: 'Sucursales', permission: 'settings.view' },
        { key: 'impuestos', label: 'Impuestos', permission: 'settings.view' },
        { key: 'usuarios', label: 'Usuarios y roles', permission: 'users.manage' },
      ];

      const card = (title, body) => `
        <div class="bg-white rounded-xl border border-slate-200 p-4">
          <h2 class="font-semibold text-slate-900 mb-3">${title}</h2>
          ${body}
        </div>`;

      // ---------- configuracion ----------

      function renderConfig() {
        const s = state.settings;
        const editable = can(me, 'settings.edit');
        return (
          card(
            'Como opera el restaurante',
            `
            <div class="text-sm text-slate-600 mb-3">
              ${s.name} · ${s.business_type} · ${s.currency}
            </div>
            <div class="space-y-3">
              <div>
                <div class="text-sm font-medium text-slate-700 mb-1">Canales activos</div>
                <div class="flex flex-wrap gap-3">
                  ${CHANNELS.map(
                    (c) => `
                    <label class="flex items-center gap-1.5 text-sm">
                      <input type="checkbox" class="ch" value="${c}" ${s.channels.includes(c) ? 'checked' : ''} ${editable ? '' : 'disabled'} />
                      ${c}
                    </label>`
                  ).join('')}
                </div>
              </div>
              <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" id="uses-tables" ${s.uses_tables ? 'checked' : ''} ${editable ? '' : 'disabled'} />
                Maneja mesas
              </label>
              <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" id="asks-tip" ${s.asks_tip ? 'checked' : ''} ${editable ? '' : 'disabled'} />
                Pide propina
              </label>
              ${
                editable
                  ? '<button id="save-config" class="bg-slate-900 text-white rounded-lg px-4 py-2 text-sm font-medium">Guardar</button>'
                  : '<p class="text-xs text-slate-500">Sin permiso para editar.</p>'
              }
            </div>`
          ) +
          `<p class="text-xs text-slate-500 px-1">
             Esto cambia como se comporta el sistema sin tocar codigo: los canales
             apagados se rechazan al tomar pedidos, y sin mesas ni propina esos
             campos desaparecen de la pantalla de venta.
           </p>`
        );
      }

      async function saveConfig() {
        const channels = [...document.querySelectorAll('.ch:checked')].map((c) => c.value);
        try {
          await api('/settings', {
            method: 'PATCH',
            body: JSON.stringify({
              channels,
              uses_tables: document.getElementById('uses-tables').checked,
              asks_tip: document.getElementById('asks-tip').checked,
            }),
          });
          toast('Configuracion guardada', 'ok');
          await loadAll();
          show('config');
        } catch (err) {
          toast(err.message);
        }
      }

      // ---------- sucursales ----------

      function renderBranches() {
        const rows = state.branches
          .map(
            (b) => `
          <div class="py-3 flex flex-wrap items-center gap-3 border-b border-slate-100 last:border-0">
            <div class="flex-1 min-w-[180px]">
              <div class="font-medium text-sm text-slate-900">${b.name} <span class="text-slate-500">${b.code}</span></div>
              <div class="text-xs text-slate-500">${b.timezone}${b.address ? ` · ${b.address}` : ''}</div>
            </div>
            <span class="text-xs ${b.is_active ? 'text-emerald-700' : 'text-slate-500'}">${b.is_active ? 'activa' : 'inactiva'}</span>
            ${
              can(me, 'branches.manage')
                ? `<button data-branch-toggle="${b.id}" data-value="${!b.is_active}"
                     class="text-sm border border-slate-300 rounded-lg px-3 py-1 hover:border-slate-900">
                     ${b.is_active ? 'Desactivar' : 'Activar'}</button>
                   <button data-tables="${b.id}" class="text-sm border border-slate-300 rounded-lg px-3 py-1 hover:border-slate-900">Mesas</button>`
                : ''
            }
          </div>`
          )
          .join('');

        return (
          card('Sucursales', rows || '<p class="text-sm text-slate-500">Sin sucursales.</p>') +
          (can(me, 'branches.manage')
            ? card(
                'Nueva sucursal',
                `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                   <input id="b-name" placeholder="Nombre" class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
                   <input id="b-code" placeholder="Codigo (prefijo del pedido)" maxlength="10" class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
                   <input id="b-address" placeholder="Direccion" class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
                   <input id="b-tz" value="America/Bogota" class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
                 </div>
                 <button id="b-add" class="mt-2 bg-slate-900 text-white rounded-lg px-4 py-2 text-sm font-medium">Crear sucursal</button>`
              )
            : '') +
          '<div id="tables-panel"></div>'
        );
      }

      async function showTables(branchId) {
        const branch = state.branches.find((b) => b.id === branchId);
        const tables = await api(`/branches/${branchId}/tables`);
        document.getElementById('tables-panel').innerHTML = card(
          `Mesas de ${branch.name}`,
          `${
            tables.length
              ? `<div class="flex flex-wrap gap-2 mb-3">${tables
                  .map(
                    (t) =>
                      `<span class="border border-slate-300 rounded-lg px-3 py-1 text-sm">${t.code} <span class="text-slate-500">(${t.capacity})</span></span>`
                  )
                  .join('')}</div>`
              : '<p class="text-sm text-slate-500 mb-3">Sin mesas.</p>'
          }
          <div class="flex flex-wrap gap-2">
            <input id="t-code" placeholder="Codigo" class="w-32 rounded-lg border border-slate-300 px-3 py-2 text-sm" />
            <input id="t-cap" type="number" min="1" value="4" class="w-24 rounded-lg border border-slate-300 px-3 py-2 text-sm" />
            <button data-add-table="${branchId}" class="bg-slate-900 text-white rounded-lg px-4 py-2 text-sm font-medium">Agregar mesa</button>
          </div>`
        );
      }

      // ---------- impuestos ----------

      function renderTaxes() {
        const rows = state.taxes
          .map(
            (t) => `
          <div class="py-3 flex flex-wrap items-center gap-3 border-b border-slate-100 last:border-0">
            <div class="flex-1 min-w-[180px]">
              <div class="font-medium text-sm text-slate-900">${t.name}</div>
              <div class="text-xs text-slate-500 tabular-nums">
                ${(Number(t.rate) * 100).toFixed(2)}% · ${t.included_in_price ? 'incluido en el precio' : 'se suma al precio'}
              </div>
            </div>
            ${
              t.is_default
                ? '<span class="text-xs text-emerald-700">por defecto</span>'
                : can(me, 'settings.edit')
                  ? `<button data-default="${t.id}" class="text-sm border border-slate-300 rounded-lg px-3 py-1 hover:border-slate-900">Hacer default</button>`
                  : ''
            }
          </div>`
          )
          .join('');

        return (
          card('Impuestos', rows || '<p class="text-sm text-slate-500">Sin impuestos.</p>') +
          (can(me, 'settings.edit')
            ? card(
                'Nuevo impuesto',
                `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                   <input id="tx-name" placeholder="Nombre (ej. IVA 19%)" class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
                   <input id="tx-rate" type="number" step="0.0001" min="0" max="0.9999" placeholder="Tasa: 0.08 es 8%"
                     class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
                 </div>
                 <div class="flex flex-wrap gap-4 mt-2 text-sm">
                   <label class="flex items-center gap-2"><input type="checkbox" id="tx-included" checked /> Incluido en el precio</label>
                   <label class="flex items-center gap-2"><input type="checkbox" id="tx-default" /> Dejarlo por defecto</label>
                 </div>
                 <button id="tx-add" class="mt-2 bg-slate-900 text-white rounded-lg px-4 py-2 text-sm font-medium">Crear impuesto</button>
                 <p class="text-xs text-slate-500 mt-2">La tasa va como fraccion: 8% se escribe 0.08.</p>`
              )
            : '')
        );
      }

      // ---------- usuarios y roles ----------

      function renderUsers() {
        const roleRows = state.roles
          .map(
            (r) => `
          <div class="py-3 border-b border-slate-100 last:border-0">
            <div class="font-medium text-sm text-slate-900">
              ${r.name} <span class="text-slate-500">${r.code}</span>
              ${r.is_system ? '<span class="text-xs text-slate-500">(sistema)</span>' : ''}
            </div>
            <div class="text-xs text-slate-500 mt-1">${r.permissions.length} permisos: ${r.permissions.join(', ')}</div>
          </div>`
          )
          .join('');

        const userRows = state.users
          .map(
            (u) => `
          <div class="py-3 flex flex-wrap items-center gap-3 border-b border-slate-100 last:border-0">
            <div class="flex-1 min-w-[180px]">
              <div class="font-medium text-sm text-slate-900">${u.name}</div>
              <div class="text-xs text-slate-500">${u.email} · ${u.role_code}</div>
            </div>
            <span class="text-xs ${u.is_active ? 'text-emerald-700' : 'text-slate-500'}">${u.is_active ? 'activo' : 'inactivo'}</span>
            <button data-user-toggle="${u.id}" data-value="${!u.is_active}"
              class="text-sm border border-slate-300 rounded-lg px-3 py-1 hover:border-slate-900">
              ${u.is_active ? 'Desactivar' : 'Activar'}</button>
          </div>`
          )
          .join('');

        return (
          card('Usuarios', userRows || '<p class="text-sm text-slate-500">Sin usuarios.</p>') +
          card(
            'Nuevo usuario',
            `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
               <input id="u-name" placeholder="Nombre" autocomplete="off" class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
               <input id="u-email" placeholder="Correo" autocomplete="off" class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
               <!-- new-password evita que Chrome rellene aqui la clave del
                    usuario que esta logueado y se cree otro con esa clave -->
               <input id="u-pass" type="password" placeholder="Clave (min 8)" autocomplete="new-password" class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
               <select id="u-role" class="rounded-lg border border-slate-300 px-3 py-2 text-sm">
                 ${state.roles.map((r) => `<option value="${r.id}">${r.name}</option>`).join('')}
               </select>
               <select id="u-branch" class="sm:col-span-2 rounded-lg border border-slate-300 px-3 py-2 text-sm">
                 <option value="">Sin sucursal fija</option>
                 ${state.branches.map((b) => `<option value="${b.id}">${b.name}</option>`).join('')}
               </select>
             </div>
             <button id="u-add" class="mt-2 bg-slate-900 text-white rounded-lg px-4 py-2 text-sm font-medium">Crear usuario</button>`
          ) +
          card('Roles', roleRows) +
          card(
            'Nuevo rol',
            `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">
               <input id="r-code" placeholder="Codigo (ej. mesero)" class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
               <input id="r-name" placeholder="Nombre" class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
             </div>
             <div class="grid grid-cols-1 sm:grid-cols-2 gap-1 max-h-64 overflow-y-auto border border-slate-200 rounded-lg p-2">
               ${state.permissions
                 .map(
                   (p) => `
                 <label class="flex items-start gap-2 text-sm py-0.5">
                   <input type="checkbox" class="perm mt-0.5" value="${p.code}" />
                   <span><span class="font-mono text-xs">${p.code}</span><br /><span class="text-xs text-slate-500">${p.description || ''}</span></span>
                 </label>`
                 )
                 .join('')}
             </div>
             <button id="r-add" class="mt-2 bg-slate-900 text-white rounded-lg px-4 py-2 text-sm font-medium">Crear rol</button>
             <p class="text-xs text-slate-500 mt-2">
               El catalogo de permisos es fijo; lo configurable es como se agrupan en roles.
             </p>`
          )
        );
      }

      // ---------- acciones ----------

      document.addEventListener('click', async (event) => {
        const t = event.target;
        try {
          if (t.id === 'save-config') await saveConfig();
          else if (t.dataset.tables) await showTables(t.dataset.tables);
          else if (t.dataset.branchToggle) {
            await api(`/branches/${t.dataset.branchToggle}/active`, {
              method: 'PATCH',
              body: JSON.stringify({ is_active: t.dataset.value === 'true' }),
            });
            await loadAll();
            show('sucursales');
          } else if (t.dataset.addTable) {
            await api(`/branches/${t.dataset.addTable}/tables`, {
              method: 'POST',
              body: JSON.stringify({
                code: document.getElementById('t-code').value,
                capacity: Number(document.getElementById('t-cap').value || 4),
              }),
            });
            toast('Mesa creada', 'ok');
            await showTables(t.dataset.addTable);
          } else if (t.id === 'b-add') {
            await api('/branches', {
              method: 'POST',
              body: JSON.stringify({
                name: document.getElementById('b-name').value,
                code: document.getElementById('b-code').value,
                address: document.getElementById('b-address').value || null,
                timezone: document.getElementById('b-tz').value,
              }),
            });
            toast('Sucursal creada', 'ok');
            await loadAll();
            show('sucursales');
          } else if (t.dataset.default) {
            await api(`/tax-rates/${t.dataset.default}/default`, { method: 'PUT' });
            await loadAll();
            show('impuestos');
          } else if (t.id === 'tx-add') {
            await api('/tax-rates', {
              method: 'POST',
              body: JSON.stringify({
                name: document.getElementById('tx-name').value,
                rate: Number(document.getElementById('tx-rate').value || 0),
                included_in_price: document.getElementById('tx-included').checked,
                is_default: document.getElementById('tx-default').checked,
              }),
            });
            toast('Impuesto creado', 'ok');
            await loadAll();
            show('impuestos');
          } else if (t.id === 'u-add') {
            await api('/users', {
              method: 'POST',
              body: JSON.stringify({
                name: document.getElementById('u-name').value,
                email: document.getElementById('u-email').value,
                password: document.getElementById('u-pass').value,
                role_id: document.getElementById('u-role').value,
                branch_id: document.getElementById('u-branch').value || null,
              }),
            });
            toast('Usuario creado', 'ok');
            await loadAll();
            show('usuarios');
          } else if (t.dataset.userToggle) {
            await api(`/users/${t.dataset.userToggle}/active`, {
              method: 'PATCH',
              body: JSON.stringify({ is_active: t.dataset.value === 'true' }),
            });
            await loadAll();
            show('usuarios');
          } else if (t.id === 'r-add') {
            await api('/roles', {
              method: 'POST',
              body: JSON.stringify({
                code: document.getElementById('r-code').value,
                name: document.getElementById('r-name').value,
                permissions: [...document.querySelectorAll('.perm:checked')].map((c) => c.value),
              }),
            });
            toast('Rol creado', 'ok');
            await loadAll();
            show('usuarios');
          }
        } catch (err) {
          toast(err.message);
        }
      });

      // ---------- navegacion ----------

      function show(key) {
        document.querySelectorAll('[data-tab]').forEach((b) => {
          const active = b.dataset.tab === key;
          b.className = `px-4 py-2 rounded-lg text-sm font-medium ${
            active ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-200'
          }`;
        });
        const panel = document.getElementById('panel');
        if (key === 'config') panel.innerHTML = renderConfig();
        else if (key === 'sucursales') panel.innerHTML = renderBranches();
        else if (key === 'impuestos') panel.innerHTML = renderTaxes();
        else if (key === 'usuarios') panel.innerHTML = renderUsers();
      }

      async function loadAll() {
        const [settings, branches, taxes] = await Promise.all([
          api('/settings'),
          api('/branches'),
          api('/tax-rates'),
        ]);
        state.settings = settings;
        state.branches = branches;
        state.taxes = taxes;

        if (can(me, 'users.manage')) {
          const [roles, users, permissions] = await Promise.all([
            api('/roles'),
            api('/users'),
            api('/permissions'),
          ]);
          state.roles = roles;
          state.users = users;
          state.permissions = permissions;
        }
      }

      async function init() {
        me = await requireSession();
        setCurrency(me.currency);
        document.getElementById('nav').innerHTML = renderNav(me, '/admin.html');

        const tabs = TABS.filter((t) => can(me, t.permission));
        document.getElementById('tabs').innerHTML = tabs
          .map((t) => `<button data-tab="${t.key}">${t.label}</button>`).join('');
        document.querySelectorAll('[data-tab]').forEach((b) =>
          b.addEventListener('click', () => show(b.dataset.tab))
        );

        await loadAll();
        show(tabs[0].key);
      }

      init().catch((err) => toast(err.message));
    </script>
  </body>
</html>
