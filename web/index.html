<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plataforma de restaurantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/app.css" />

    <!-- Instalable: una tableta de mostrador se abre a pantalla completa y,
         con el service worker que registra app.js, sigue sirviendo cuando el
         internet se corta. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1c1917" />
    <link rel="icon" href="/iconos/app.svg" type="image/svg+xml" />
    <!-- iOS no lee el manifiesto: su icono de pantalla de inicio sale de
         aquí, y solo acepta PNG. -->
    <link rel="apple-touch-icon" href="/iconos/app-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div class="flex min-h-screen">
      <!-- Barra lateral: en escritorio es la navegación; en móvil se oculta
           y baja al pulgar como barra inferior. -->
      <aside id="rail" class="rail hidden md:flex md:flex-col md:w-[60px] lg:w-[212px] shrink-0"></aside>

      <div class="flex-1 min-w-0 flex flex-col">
        <div id="topbar"></div>
        <!-- Tope de ancho: una fila de 1900px obliga a barrer la pantalla con
             la vista para relacionar la primera columna con la última. -->
        <main id="vista" class="flex-1 w-full max-w-[1380px] px-4 py-5 md:px-7 pb-24 md:pb-10"></main>
      </div>
    </div>

    <div id="barra-inferior"></div>
    <div id="toast-host" class="fixed bottom-20 md:bottom-5 right-5 z-50"></div>

    <!-- Aquí se arma lo que se va a imprimir. Vive fuera de la aplicación y
         es hijo directo de <body> porque la hoja de impresión esconde a
         todos sus hermanos: ver `@media print` en app.css. -->
    <div id="impresion"></div>

    <script type="module" src="/js/app.js"></script>
    <noscript><p class="p-4">Esta aplicación necesita JavaScript para funcionar.</p></noscript>
  </body>
</html>
