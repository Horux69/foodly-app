<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingresar</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
      <form id="form" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
        <div>
          <h1 class="text-xl font-semibold text-slate-900">Ingresar</h1>
          <p class="text-sm text-slate-500 mt-1">Plataforma de restaurantes</p>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Correo</label>
          <input
            id="email"
            type="email"
            required
            autocomplete="username"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-900"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Contrasena</label>
          <input
            id="password"
            type="password"
            required
            autocomplete="current-password"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-900"
          />
        </div>

        <p id="error" class="hidden text-sm text-red-600"></p>

        <button
          id="submit"
          type="submit"
          class="w-full bg-slate-900 text-white rounded-lg py-2 font-medium hover:bg-slate-800 disabled:opacity-50"
        >
          Entrar
        </button>
      </form>
    </div>

    <script src="/app.js"></script>
    <script>
      const form = document.getElementById('form');
      const errorEl = document.getElementById('error');
      const submitEl = document.getElementById('submit');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorEl.classList.add('hidden');
        submitEl.disabled = true;

        try {
          const data = await api('/auth/login', {
            method: 'POST',
            body: JSON.stringify({
              email: document.getElementById('email').value,
              password: document.getElementById('password').value,
            }),
          });
          setToken(data.access_token);

          // Se decide el destino por permisos: un cocinero no deberia caer
          // en la pantalla de toma de pedidos.
          const me = await api('/auth/me');
          window.location.href = me.permissions.includes('orders.create')
            ? '/pedidos.html'
            : '/cocina.html';
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.classList.remove('hidden');
          submitEl.disabled = false;
        }
      });
    </script>
  </body>
</html>
